# Cloudflare Pages + D1 (free tier). NOT deployed by anyone without the owner's go-ahead; see README.md "Deploy".
name = "voter-list"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "voter-list"
database_id = "61171e0a-0cf7-4ef8-99ee-d239dad583a7"
migrations_dir = "migrations"

# Secrets (never in this file): SIGNING_KEY, PEPPER, and optionally RESEND_API_KEY, MAIL_FROM.
# Do NOT set TEST_MODE in production.

# The smoke-test (preview) deployment uses its own empty database, never the live one.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "voter-list-preview"
database_id = "7fc651ef-0c25-4207-a2b7-554f2deca000"
migrations_dir = "migrations"
